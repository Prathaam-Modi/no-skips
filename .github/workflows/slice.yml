name: Slice print files

# Runs when print-files/a1_ready/SLICE_QUEUE.json changes on main. Slices every project listed there with
# Bambu Studio (A1, Textured PEI, PLA Basic), commits the .gcode.3mf files and SLICED.json, empties the queue.
on:
  push:
    branches: [main]
    paths: ["print-files/a1_ready/SLICE_QUEUE.json"]
  workflow_dispatch:

concurrency:
  group: slice
  cancel-in-progress: false

permissions:
  contents: write

env:
  BAMBU_VERSION: v02.02.02.56
  BAMBU_STUDIO_DIR: ${{ github.workspace }}/.bambu/squashfs-root

jobs:
  slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: pip install numpy trimesh

      - name: Cache Bambu Studio
        id: bambu-cache
        uses: actions/cache@v4
        with:
          path: .bambu/BambuStudio.AppImage
          key: bambu-studio-${{ env.BAMBU_VERSION }}-ubuntu-24.04

      - name: Download Bambu Studio
        if: steps.bambu-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .bambu
          # shellcheck disable=SC2016
          name=$(gh release view "$BAMBU_VERSION" --repo bambulab/BambuStudio --json assets \
            --jq '[.assets[].name | select(endswith(".AppImage"))] as $a
                  | ([$a[] | select(test("24\\.04"))] + [$a[] | select(test("ubuntu"; "i"))] + $a)[0] // empty')
          if [ -z "$name" ]; then echo "::error::No AppImage found in Bambu Studio $BAMBU_VERSION"; exit 1; fi
          gh release download "$BAMBU_VERSION" --repo bambulab/BambuStudio --pattern "$name" --output .bambu/BambuStudio.AppImage

      - name: Install Bambu Studio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0t64 libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            libgl1 libegl1 libfontconfig1 libdbus-1-3 libwayland-client0 libwayland-server0
          cd .bambu && chmod +x BambuStudio.AppImage && rm -rf squashfs-root
          ./BambuStudio.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/bin/bambu-studio

      - name: Slice
        run: python tools/slice/slice_queue.py

      - name: Commit the sliced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add print-files/a1_ready
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Sliced print files (Bambu Studio $BAMBU_VERSION)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
