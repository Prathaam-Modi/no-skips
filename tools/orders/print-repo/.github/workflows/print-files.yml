name: Print files

run-name: Print files ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Order number, NS-DDMM-XXXX"
        required: true
        type: string
      jobs:
        description: 'JSON array of jobs, e.g. [{"product":"tag","link":"https://open.spotify.com/track/...","title":"","artist":"","name":"Dimo","line1":"","line2":"","accent":"red","qty":1,"item":"A5 Track Tag"}]'
        required: true
        type: string

concurrency:
  group: print-files
  cancel-in-progress: false

permissions:
  contents: write

env:
  BAMBU_VERSION: v02.02.02.56
  BAMBU_STUDIO_DIR: ${{ github.workspace }}/.bambu/squashfs-root

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check the order number
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [[ ! "$REF" =~ ^NS-(0[1-9]|[12][0-9]|3[01])(0[1-9]|1[0-2])-[A-Z0-9]{4}$ ]]; then
            echo "::error::Order number must look like NS-DDMM-XXXX"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Bambu Studio
        id: bambu-cache
        uses: actions/cache@v4
        with:
          path: .bambu/BambuStudio.AppImage
          key: bambu-studio-${{ env.BAMBU_VERSION }}-ubuntu-24.04

      - name: Download Bambu Studio
        if: steps.bambu-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE_URL: ${{ vars.BAMBU_APPIMAGE_URL }}
        run: |
          mkdir -p .bambu
          if [ -n "$APPIMAGE_URL" ]; then
            curl -fsSL -o .bambu/BambuStudio.AppImage "$APPIMAGE_URL"
          else
            # shellcheck disable=SC2016  # the single quotes hold a jq program
            name=$(gh release view "$BAMBU_VERSION" --repo bambulab/BambuStudio --json assets \
              --jq '[.assets[].name | select(endswith(".AppImage"))] as $a
                    | ([$a[] | select(test("24\\.04"))] + [$a[] | select(test("ubuntu"; "i"))] + $a)[0] // empty')
            if [ -z "$name" ]; then echo "::warning::No AppImage found in Bambu Studio $BAMBU_VERSION"; exit 1; fi
            echo "Downloading $name"
            gh release download "$BAMBU_VERSION" --repo bambulab/BambuStudio --pattern "$name" --output .bambu/BambuStudio.AppImage
          fi
          sha256sum .bambu/BambuStudio.AppImage

      - name: Install Bambu Studio
        id: bambu
        continue-on-error: true
        run: |
          test -s .bambu/BambuStudio.AppImage
          # Libraries the slicer binary links against (ffmpeg libraries ship inside the AppImage).
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0t64 libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            libgl1 libegl1 libfontconfig1 libdbus-1-3 libwayland-client0 libwayland-server0
          cd .bambu
          chmod +x BambuStudio.AppImage
          rm -rf squashfs-root
          ./BambuStudio.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/bin/bambu-studio

      - name: Make the print files
        timeout-minutes: 10
        env:
          REF: ${{ inputs.ref }}
          JOBS: ${{ inputs.jobs }}
        run: python tools/make_order.py --ref "$REF" --jobs "$JOBS" --no-slice

      - name: Slice
        if: steps.bambu.outcome == 'success'
        timeout-minutes: 10
        continue-on-error: true
        env:
          REF: ${{ inputs.ref }}
          SLICE_BUDGET_S: "540"
        run: python tools/make_order.py --ref "$REF" --slice-only --budget "$SLICE_BUDGET_S"

      - name: Note when Bambu Studio is missing
        if: steps.bambu.outcome != 'success'
        env:
          REF: ${{ inputs.ref }}
        run: |
          python - <<'EOF'
          import json, os
          p = os.path.join("orders", os.environ["REF"], "summary.json")
          s = json.load(open(p))
          for j in s["jobs"]:
              if j["ok"] and not j.get("sliced"):
                  j["note"] = j["note"].replace(" Not sliced yet.", "") + " Not sliced: Bambu Studio could not be installed on the runner. The project .3mf is ready; open it in Bambu Studio and press Slice."
          json.dump(s, open(p, "w"), indent=2)
          EOF

      - name: Commit the files
        env:
          REF: ${{ inputs.ref }}
        run: |
          test -f "orders/$REF/summary.json"
          rm -f "orders/$REF/.plan.json"
          git config user.name "no-skips-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -A "orders/$REF"
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Print files for $REF"
          for _ in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
            git pull --rebase origin main
          done
          exit 1
